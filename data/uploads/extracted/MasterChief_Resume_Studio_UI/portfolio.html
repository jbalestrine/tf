<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Architecture Portfolio</title>
<style>body{margin:0;color:#002050;background:#f0f6ff;font:16px/1.5 system-ui}header{background:#002050;color:white;border-bottom:4px solid #50e6ff;padding:35px 7%}h1{margin:0}.hero{display:flex;align-items:center;gap:18px}main{max-width:1100px;margin:auto;padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:white;border:1px solid #b4d6fa;border-top:4px solid #0078d4;padding:16px}.card strong{font-size:1.6rem;color:#0078d4}input{padding:10px;width:min(100%,500px);box-sizing:border-box}a{color:#0078d4}li{margin:6px 0}iframe{width:100%;height:75vh;border:1px solid #b4d6fa}</style></head><body>
<header><div class="hero"><svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M32 2 56 10 59 32 53 49 32 62 11 49 5 32 8 10Z" fill="#0B192C" stroke="#0078D4" stroke-width="2.5"/><path d="M12 17 20 11 44 11 52 17 49 35 44 43 32 51 20 43 15 35Z" fill="#102B45" stroke="#00B4D8" stroke-width="1.5"/><path d="M15 22 24 18 40 18 49 22 45 30 35 33 32 30 29 33 19 30Z" fill="#00B4D8"/><path d="M21 23 27 21 37 21 43 23" fill="none" stroke="#E0FAFF" stroke-width="1.5" stroke-linecap="round"/><path d="M21 37 25 41 32 44 39 41 43 37 M32 51V56 M12 14 8 14 M52 14 56 14" fill="none" stroke="#0078D4" stroke-width="2" stroke-linecap="round"/><path d="M25 9a4 4 0 0 1 7-2 4.5 4.5 0 0 1 7 2" fill="none" stroke="#E0FAFF" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="14" r="2" fill="#00B4D8"/><circle cx="57" cy="14" r="2" fill="#00B4D8"/><circle cx="32" cy="57" r="2" fill="#00B4D8"/></svg><div><h1 id="name">Architecture Portfolio</h1><div id="titles"></div></div></div></header>
<main><h2>Enterprise Impact</h2><div id="metrics" class="cards"></div><h2>Tool &amp; Architecture Arsenal</h2><input id="filter" placeholder="Filter skills" aria-label="Filter skills"><div id="skills"></div><h2>Approved Resumes</h2><ul id="files"></ul><iframe id="preview" title="Resume preview" hidden></iframe><p id="error" role="alert"></p></main>
<script>const $=id=>document.getElementById(id);function add(tag,text,parent){let e=document.createElement(tag);e.textContent=text;parent.appendChild(e);return e}let skills=[];function render(){let q=$('filter').value.toLowerCase(),box=$('skills');box.replaceChildren();for(let g of skills){let items=g.items.filter(x=>(g.category+' '+x).toLowerCase().includes(q));if(items.length){add('h3',g.category,box);add('p',items.join(' · '),box)}}}
fetch('/api/portfolio/data').then(r=>{if(!r.ok)throw Error('Portfolio data unavailable');return r.json()}).then(data=>{$('name').textContent=data.name;$('titles').textContent=data.titles.join(' | ');skills=data.skills;render();for(let m of data.metrics){let c=add('div','',$('metrics'));c.className='card';add('strong',m.value,c);add('div',m.label,c)}for(let f of data.files){let li=add('li',f.name+' — ',$('files'));let p=add('a','Preview',li);p.href=f.preview;p.onclick=e=>{e.preventDefault();$('preview').hidden=false;$('preview').src=f.preview};li.append(' | ');let d=add('a','Download',li);d.href=f.download}}).catch(e=>$('error').textContent=e.message);$('filter').oninput=render;</script></body></html>
