<div class="section">
    <h2>{{ title }}</h2>
    <p style="color:#9aa4b2;">{{ description }}</p>
    <p>This page is the starting point for <code>roku</code>. Edit this file to change what the page shows.</p>
    <button class="btn btn-info" id="roku-ping" type="button">Test the API</button>
    <pre id="roku-out" style="margin-top:8px;"></pre>
</div>
<script>
document.getElementById('roku-ping').addEventListener('click', async function () {
    const r = await fetch('/ext/roku/api/ping', { credentials: 'same-origin' });
    document.getElementById('roku-out').textContent = JSON.stringify(await r.json(), null, 2);
});
</script>
