# Generated by MasterChief. Review before committing.
stages: [test, package, deploy]

test:
  stage: test
  image: python:3.13
  script:
    - pip install -r requirements.txt
    - pytest -q

package:
  stage: package
  image: python:3.13
  script:
    - pip install build
    - python -m build
  artifacts:
    paths: [dist/]
  rules:
    - if: $CI_COMMIT_TAG

deploy_render:
  stage: deploy
  image: curlimages/curl
  script:
    - curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
