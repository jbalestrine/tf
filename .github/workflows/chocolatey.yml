name: Chocolatey Package Validation

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-chocolatey:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          ./chocolatey/release.ps1 -OutputDirectory ./chocolatey/dist

      - name: Upload Chocolatey package artifact
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-package
          path: chocolatey/dist/*.nupkg
