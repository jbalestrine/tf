# Prometheus Alert Rules for MasterChief Platform

groups:
  - name: masterchief_platform
    interval: 30s
    rules:
      - alert: PlatformDown
        expr: up{job="masterchief-platform"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MasterChief platform is down"
          description: "The MasterChief platform has been down for more than 1 minute."
      
      - alert: HighServerErrorRate
        expr: sum(rate(masterchief_http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MasterChief is returning frequent server errors"
          description: "MasterChief returned more than 0.1 HTTP 5xx responses per second over the last 5 minutes."
      
      - alert: RepeatedServerErrors
        expr: increase(masterchief_http_requests_total{status=~"5.."}[5m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Repeated MasterChief server errors"
          description: "More than three HTTP 5xx responses were recorded in the last 5 minutes."
      
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(masterchief_http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MasterChief HTTP request latency is high"
          description: "95th percentile request latency is {{ $value }} seconds."
      
      - alert: HighAPIErrorRatio
        expr: sum(rate(masterchief_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(masterchief_http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MasterChief HTTP 5xx ratio is high"
          description: "More than 5% of MasterChief HTTP requests returned a server error over the last 5 minutes."

  - name: masterchief_infrastructure
    interval: 60s
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%."
      
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}%."
      
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Only {{ $value }}% disk space available on {{ $labels.mountpoint }}."
