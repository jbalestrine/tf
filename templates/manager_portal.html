<!doctype html>
<html><head><meta charset="utf-8"><title>Manager Portal</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f5f7fb}
.top{padding:12px;background:#1f2937;color:#fff;display:flex;align-items:center;justify-content:space-between}
.container{display:flex;gap:16px;padding:16px}
.kanban{flex:1;display:flex;gap:12px}
.col{background:#fff;border-radius:6px;padding:8px;min-width:260px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.col h3{margin:6px 0;font-size:14px}
.card{background:#f8fafc;margin:8px 0;padding:8px;border-radius:4px;cursor:grab}
.card.dragging{opacity:.5}
.sidebar{width:360px}
.section{background:#fff;padding:12px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.04);margin-bottom:12px}
.btn{display:inline-block;padding:8px 10px;background:#2563eb;color:#fff;border-radius:4px;text-decoration:none}
label{display:block;margin-top:8px;font-size:13px}
input,textarea,select{width:100%;padding:8px;margin-top:4px;border:1px solid #e5e7eb;border-radius:4px}
</style></head><body>
<div class="top"><div style="font-weight:700">Manager Portal</div><div><a href="/master-menu" style="color:#fff;text-decoration:none;margin-right:14px">Master Menu</a><a href="/" style="color:#fff;text-decoration:none">Back to Dashboard</a></div></div>
<div class="container"><div class="kanban"><div class="col" data-status="todo"><h3>To Do</h3><div class="cards" id="col-todo"></div></div><div class="col" data-status="inprogress"><h3>In Progress</h3><div class="cards" id="col-inprogress"></div></div><div class="col" data-status="done"><h3>Done</h3><div class="cards" id="col-done"></div></div></div>
<div class="sidebar"><div class="section"><h4>Create Task</h4><label>Title<input id="task-title"></label><label>Assignee<input id="task-assignee"></label><label>Module<input id="task-module" placeholder="echo"></label><label>Feature<input id="task-feature" placeholder="chat"></label><label>Workflow Item<input id="task-workflow" placeholder="api parity check"></label><label>Tags (comma-separated)<input id="task-tags" placeholder="llm, blocker, api"></label><label>Description<textarea id="task-desc"></textarea></label><label>Priority<select id="task-priority"><option>low</option><option selected>medium</option><option>high</option></select></label><div style="margin-top:8px"><a id="create-task" class="btn">Create</a></div></div>
<div class="section"><h4>Workflow Index</h4><div id="workflow-index" style="font-size:13px;color:#334155">No items yet.</div></div>
<div class="section"><h4>Effort Timeline</h4><div id="effort-timeline" style="max-height:200px;overflow:auto;font-size:12px;color:#334155">No activity yet.</div></div>
<div class="section"><h4>Model Manager</h4><div id="models-list">Loading models...</div><label>Model path (or filename)<input id="model-input" placeholder="models/Phi-3-mini-4k-instruct-q4.gguf"></label><div style="margin-top:8px"><a id="preload-model" class="btn">Set Default Model</a></div></div>
<div class="section"><h4>Test Runner</h4><div id="test-status">No test run yet.</div><div style="margin-top:8px"><a id="run-tests" class="btn">Run Tests</a></div><pre id="test-output" style="height:160px;overflow:auto;background:#0f172a;color:#e6eef8;padding:8px;border-radius:4px;margin-top:8px"></pre></div></div></div>
<script>
async function api(path, opts){const res = await fetch(path, opts); return res.json();}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild}
function esc(v){return String(v==null?'':v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
let dragged=null;
function renderCard(t){const tags=(Array.isArray(t.tags)?t.tags:[]).map(tag=>`<span style="display:inline-block;background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:999px;margin-right:4px;margin-top:4px;font-size:11px">${esc(tag)}</span>`).join('');const scope=[t.module,t.feature,t.workflow_item].filter(Boolean).map(esc).join(' / ');const node = el(`<div class="card" draggable="true" data-id="${t.id}"><strong>${esc(t.title)}</strong><div style="font-size:12px;color:#555">${esc(t.assignee||'unassigned')} • ${esc(t.priority)}</div>${scope?`<div style="font-size:12px;color:#0f766e;margin-top:4px">${scope}</div>`:''}${tags?`<div>${tags}</div>`:''}<div style="margin-top:6px;font-size:13px">${esc((t.description||'').slice(0,200))}</div></div>`);node.addEventListener('dragstart',e=>{dragged=node;node.classList.add('dragging')});node.addEventListener('dragend',e=>{dragged=null;node.classList.remove('dragging')});node.addEventListener('dblclick',async e=>{const newTitle=prompt('Edit title',t.title); if(newTitle!==null){t.title=newTitle; await fetch('/api/manager/tasks',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)}); loadTasks();}});return node;}
function renderWorkflowIndex(tasks){const bucket={};tasks.forEach(t=>{const k=[t.module||'unscoped',t.feature||'general'].join(' / ');bucket[k]=bucket[k]||[];bucket[k].push(t)});const lines=Object.keys(bucket).sort().map(k=>{const counts={todo:0,inprogress:0,done:0};bucket[k].forEach(t=>{const s=t.status||'todo';if(counts[s]!==undefined) counts[s]+=1});return `<div style="margin-bottom:8px"><strong>${esc(k)}</strong><div style="color:#64748b">todo ${counts.todo} • in progress ${counts.inprogress} • done ${counts.done}</div></div>`});document.getElementById('workflow-index').innerHTML=lines.length?lines.join(''):'No items yet.';}
function renderEffortTimeline(tasks){const sorted=[...tasks].sort((a,b)=>String(b.updated_at||b.created_at||'').localeCompare(String(a.updated_at||a.created_at||'')));const rows=sorted.slice(0,30).map(t=>{const when=t.updated_at||t.created_at||'';const scope=[t.module,t.feature,t.workflow_item].filter(Boolean).join(' / ');return `<div style="padding:6px 0;border-bottom:1px solid #e2e8f0"><div><strong>${esc(t.title)}</strong> <span style="color:#64748b">(${esc(t.status||'todo')})</span></div><div style="color:#64748b">${esc(scope||'unscoped')} • ${esc(when)}</div></div>`});document.getElementById('effort-timeline').innerHTML=rows.length?rows.join(''):'No activity yet.';}
async function loadTasks(){const j = await api('/api/manager/tasks');['todo','inprogress','done'].forEach(s=>document.getElementById('col-'+s).innerHTML='');j.forEach(t=>{document.getElementById('col-'+(t.status||'todo')).appendChild(renderCard(t))});renderWorkflowIndex(j);renderEffortTimeline(j);} 
document.querySelectorAll('.col').forEach(col=>{col.addEventListener('dragover',e=>e.preventDefault());col.addEventListener('drop',async e=>{e.preventDefault(); if(!dragged) return; const id=dragged.dataset.id; const status=col.dataset.status; await fetch('/api/manager/tasks',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})}); loadTasks();});});
document.getElementById('create-task').addEventListener('click',async e=>{const title=document.getElementById('task-title').value.trim(); if(!title) return alert('Title required');const payload={title,assignee:document.getElementById('task-assignee').value,module:document.getElementById('task-module').value,feature:document.getElementById('task-feature').value,workflow_item:document.getElementById('task-workflow').value,tags:document.getElementById('task-tags').value,description:document.getElementById('task-desc').value,priority:document.getElementById('task-priority').value,status:'todo'};await fetch('/api/manager/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); ['task-title','task-assignee','task-module','task-feature','task-workflow','task-tags','task-desc'].forEach(id=>document.getElementById(id).value=''); loadTasks();});
async function loadModels(){const j = await api('/api/manager/models');const node = document.getElementById('models-list'); node.innerHTML='';node.appendChild(el('<div style="font-size:13px;margin-bottom:8px">Available models:</div>'));j.models.forEach(m=>{const row=el(`<div style="margin-bottom:6px"><code style="font-size:12px">${m}</code> ${j.default===m?'<strong>(default)</strong>':''} <button data-m="${m}" class="btn" style="background:#0ea5a4;margin-left:8px">Use</button></div>`); row.querySelector('button').addEventListener('click',async ()=>{document.getElementById('model-input').value=m}); node.appendChild(row)});} 
document.getElementById('preload-model').addEventListener('click',async ()=>{const model=document.getElementById('model-input').value.trim(); if(!model) return alert('model path required'); const j=await api('/api/manager/models/preload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model})}); alert(j.ok? 'Default model set' : ('Error: '+(j.error||'unknown'))); loadModels();});
document.getElementById('run-tests').addEventListener('click',async ()=>{document.getElementById('test-status').innerText='Queued...'; const r=await api('/api/manager/run_tests',{method:'POST'}); if(!r.ok){document.getElementById('test-status').innerText='Failed to start'; return;} pollTests();});
async function pollTests(){document.getElementById('test-status').innerText='Running...'; const j=await api('/api/manager/run_tests/status'); if(j.running){document.getElementById('test-output').innerText=j.output||''; setTimeout(pollTests,2000); return;} document.getElementById('test-status').innerText='Last run: '+(j.finished_at||''); document.getElementById('test-output').innerText=j.output||'';}
loadTasks(); loadModels(); pollTests();
</script></body></html>
